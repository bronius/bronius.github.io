<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#e9c58f">
  {%- seo %}
  <link rel="preload" href="{{ '/assets/fonts/rye.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/lora-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {%- comment -%} Backdrop is the LCP: preload the right plate per breakpoint. {%- endcomment %}
  <link rel="preload" as="image" type="image/avif" fetchpriority="high" media="(max-width: 767.98px)" imagesrcset="{% include srcset.html name='plate-mobile' fmt='avif' %}" imagesizes="100vw">
  <link rel="preload" as="image" type="image/avif" fetchpriority="high" media="(min-width: 768px)" imagesrcset="{% include srcset.html name='plate-desktop' fmt='avif' %}" imagesizes="100vw">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/site.js' | relative_url }}"></script>
  {%- if page.layout == "home" %}
  <script type="module" src="{{ '/assets/js/flickr.js' | relative_url }}"></script>
  {%- endif %}
  {%- feed_meta %}
  {%- if jekyll.environment == "production" and site.google_analytics %}
  {%- include analytics.html %}
  {%- endif %}
</head>
